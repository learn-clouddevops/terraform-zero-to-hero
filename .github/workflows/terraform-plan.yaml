---
name: Terraform-Plan
on:
  push:
    branches:
      - FeatureBranch1
jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{secrets.AWS_KEY_ID}}
      AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_SECRET_ID}}
      AWS_REGION: us-east-1
  steps:
    - name: Checkout
      uses: actions/checkout@V4
    - name: Seturp Terraform
      uses: hashicorp/setup-terraform@V1
    - name: Terraform Init
      id: Init
      run: terraform init
    - name: Terraform Plan
      id: Plan
      if: github.event_name == "push"
      run: terraform plan
